; Audio fixes for Final Fantasy XIII-2, from the FFXIII Trilogy Patcher.
; Each one can be switched off here if it ever sounds wrong on your setup.
; Restart the game after changing this file.

[Audio]
; voices and sound effects without the game's accidental low pass, so they
; aren't muffled. 0 puts the muffle back
ClearVoices=1

; on stereo speakers and headphones, folds the game's 5.1 down without
; clipping, with a limiter catching the loud moments
StereoLimiter=1

; on 5.1 and 7.1, writes every speaker channel so 7.1 has no buzz, and shares
; the surrounds with 7.1's side speakers
Surround=1
