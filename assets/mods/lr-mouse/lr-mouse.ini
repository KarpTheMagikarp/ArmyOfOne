; Mouse support for Lightning Returns, from the FFXIII Trilogy Patcher.
; While you're walking around the mouse turns the camera, left click strikes
; and right click jumps. In a fight it turns the battle camera. In a menu the
; wheel moves up and down, left click picks and right click backs out. Save
; this file and the game picks it up within a second, no restart needed.

[Mouse]
; 0 turns mouse support off
Enabled=1

; how fast the camera turns. 2.0 is twice as fast, 0.5 half as fast
Sensitivity=1.0

; 1 flips that direction
InvertX=0
InvertY=0

; 0 leaves menus to the keyboard
Menus=1
