; Save Anywhere for Final Fantasy XIII, from the FFXIII Trilogy Patcher.
; Pause while you're out exploring and press the save button to save through
; the game's own save screen. Loading that save puts you back where you were
; standing instead of at the save station. The load button on the same screen
; takes you to the load list.

[SaveAnywhere]
; 0 turns save anywhere off
Enabled=1

; which of the game's buttons saves, by XIII's own numbering: 4 is Y on Xbox,
; Triangle on PlayStation, and whatever key XIII binds to it (E by default).
; It only does anything on the pause screen. The log lists the numbers you
; press there
SaveButton=4

; the keyboard key that saves, one letter or digit. XIII binds that button
; to E out of the box, so change this if you've changed that
SaveKey=E

; 0 turns the load button off
Load=1

; which of the game's buttons loads: 6 is X on Xbox, Square on PlayStation
LoadButton=6

; the keyboard key that loads, one letter or digit, for whatever key XIII
; binds to that button
LoadKey=Q

; 0 leaves the pause screen as the game has it. 1 puts Save and Load in front
; of Quit and Resume
Prompt=1

; 1 fills the log with what the pause bar, the buttons and the spawn are
; doing, for a bug report. 0 keeps it to saves and loads
Debug=0
